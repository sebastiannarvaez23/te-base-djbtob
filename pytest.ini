[pytest]
DJANGO_SETTINGS_MODULE = base.settings.local
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = core/tests platform/tests client/tests handbook/tests

# Default run excludes ``integration`` so contributors without a live
# Postgres can run the unit suite. Run integration tests explicitly with
# ``pytest -m integration``.
addopts = -m "not integration"

# Separar tests por tipo con markers
markers =
    unit: Tests sin base de datos (use cases con mocks)
    integration: Tests con base de datos real
    api: Tests de endpoints HTTP completos
